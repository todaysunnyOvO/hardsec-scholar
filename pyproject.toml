[project]
name = "hardsec-scholar"
version = "0.1.0"
description = "A verifiable Agentic RAG assistant for hardware-security papers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.5.4",
    "langchain-core>=0.3.72",
    "langchain-openai>=0.3.28",
    "openai>=1.99.2",
    "pymupdf>=1.25.3",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "tiktoken>=0.9.0",
    "chromadb>=1.0.0,<2",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "onnxruntime>=1.17.0,<1.24.0; python_version < '3.11'",
    "fastapi>=0.116.0,<1",
    "uvicorn[standard]>=0.35.0,<1",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24.0",
    "mypy>=1.17.1,<2",
    "pytest>=8.0.0",
    "ruff>=0.6.1",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
hardsec-scholar-api = "hardsec_scholar.api.cli:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hardsec_scholar*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
markers = [
    "external: tests that require network access or external model credentials",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
